<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error de Validación</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <style>
        body { background: linear-gradient(100deg, #1a1a2e, #16213e); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-card { background: white; border-radius: 15px; padding: 40px; max-width: 600px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .error-icon { font-size: 72px; color: #dc3545; }
        .btn-primary { background: #0c005b; border: 1px solid #ffd700; color: #ffd700; }
        .btn-primary:hover { background: #ffd700; color: #0c005b; border-color: #ffd700; }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-card text-center">
            <div class="error-icon">❌</div>
            <h1 class="mt-3" style="color: #dc3545;">Error de Validación</h1>
            <p class="mt-3" style="font-size: 18px; color: #555;" th:text="${error}">Ha ocurrido un error al validar tu comentario.</p>
            <hr>
            <p style="color: #777; font-size: 14px;">El enlace de validación puede haber expirado o el comentario ya fue activado.</p>
            <a th:href="@{/blog}" class="btn btn-primary mt-3 px-4 py-2">Volver al Blog</a>
        </div>
    </div>
</body>
</html>
